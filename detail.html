<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 상세</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Apple SD Gothic Neo", Pretendard, sans-serif;
    background: #FFEFEF;
    margin: 0;
    padding: 24px 16px;
    min-height: 100vh;
    position: relative;
  }

  /* Radial Gradient Background */
  @keyframes subtle-fade-in-up {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .container {
    max-width: 400px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 32px;
    color: #C62828;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .back:hover {
    transform: translateX(4px);
    color: #B71C1C;
  }

  .detail-container {
    background: #FFFFFF;
    padding: 40px 28px 0 28px;
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    position: relative;
    animation: subtle-fade-in-up 0.6s ease-out;
  }

  .detail-container::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 24px;
    background-image:
      radial-gradient(circle 6px at 12px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 36px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 60px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 84px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 108px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 132px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 156px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 180px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 204px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 228px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 252px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 276px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 300px 0, transparent 6px, #FFFFFF 6px),
      radial-gradient(circle 6px at 324px 0, transparent 6px, #FFFFFF 6px);
    background-repeat: repeat-x;
    border-bottom-left-radius: 28px;
    border-bottom-right-radius: 28px;
  }

  .detail-container::before {
    content: '☕';
    position: absolute;
    bottom: 40px;
    right: 28px;
    font-size: 120px;
    opacity: 0.04;
    pointer-events: none;
    line-height: 1;
  }

  .detail-container:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
  }

  .order-header {
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .order-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #FFF2F2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }

  .order-info {
    flex: 1;
  }

  .order-number {
    font-size: 20px;
    font-weight: 700;
    color: #1A1A1A;
    margin-bottom: 4px;
  }

  .order-number-highlight {
    color: #C62828;
  }

  .order-time {
    font-size: 13px;
    color: #999999;
    font-weight: 500;
  }

  .divider {
    height: 1px;
    background: #E8E8E8;
    margin: 24px 0;
    border: none;
    border-bottom: 1px dashed #E8E8E8;
  }

  .section {
    margin-bottom: 0;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .section-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #FFF2F2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    color: #C62828;
    margin-top: 2px;
  }

  .section-content {
    padding: 20px 0;
    flex: 1;
    border-bottom: 1px dashed #E8E8E8;
  }

  .section:last-child .section-content {
    border-bottom: none;
  }

  .label {
    font-size: 13px;
    color: #999999;
    margin-bottom: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .value {
    font-size: 18px;
    font-weight: 600;
    color: #1A1A1A;
    line-height: 1.4;
  }

  .buyer-name {
    font-size: 18px;
    font-weight: 600;
    color: #1A1A1A;
  }

  .menu-section {
    padding: 20px 0;
    border-bottom: 1px dashed #E8E8E8;
    display: flex;
    gap: 16px;
  }

  .menu-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #FFF2F2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    color: #C62828;
    margin-top: 2px;
  }

  .menu-content {
    flex: 1;
  }

  .menu-label {
    font-size: 13px;
    color: #999999;
    margin-bottom: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .menu-name {
    font-size: 32px;
    font-weight: 700;
    color: #1A1A1A;
    margin-bottom: 16px;
    line-height: 1.2;
  }

  .quantity-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .quantity-label {
    font-size: 13px;
    color: #999999;
    font-weight: 600;
  }

  .quantity-value {
    font-size: 18px;
    font-weight: 600;
    color: #1A1A1A;
  }

  .payment-section {
    padding: 20px 0;
    border-bottom: 1px dashed #E8E8E8;
    display: flex;
    gap: 16px;
  }

  .payment-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #FFF2F2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    color: #C62828;
    margin-top: 2px;
  }

  .payment-content {
    flex: 1;
  }

  .payment-label {
    font-size: 13px;
    color: #999999;
    margin-bottom: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .price-line {
    font-size: 15px;
    color: #999999;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .total-line {
    font-size: 28px;
    font-weight: 700;
    color: #C62828;
    line-height: 1.2;
  }

  .status-section {
    padding: 24px 0;
    margin: 0 -28px -40px -28px;
    padding: 24px 28px 28px 28px;
    background: #EAF9EC;
    border-radius: 0 0 28px 28px;
  }

  .status-badge {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: #EAF9EC;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    color: #2E7D32;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-icon {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #2E7D32;
    flex-shrink: 0;
  }

  .status-right {
    color: #2E7D32;
    font-size: 18px;
  }

  .error {
    color: #C62828;
    padding: 24px;
    background: #FFEBEE;
    border-radius: 16px;
    font-size: 14px;
    text-align: center;
    font-weight: 500;
  }

  .loading {
    color: #999999;
    text-align: center;
    font-size: 14px;
    padding: 60px 24px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="container">
    <a class="back" href="list.html">← 판매 현황으로</a>
    <div class="detail-container" id="detail">
      <div class="loading">주문 정보를 불러오는 중...</div>
    </div>
  </div>

<script>
async function load() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  const detailEl = document.getElementById('detail');

  if (!id) {
    detailEl.innerHTML = '<div class="error">주문 번호가 없습니다</div>';
    return;
  }

  try {
    const res = await fetch(`/api/list?id=${id}`);
    if (!res.ok) {
      detailEl.innerHTML = '<div class="error">주문을 찾을 수 없습니다</div>';
      return;
    }
    const data = await res.json();

    const date = new Date(data.purchased_at);
    const dateStr = date.toLocaleDateString('ko-KR').replace(/\./g, '.').slice(0, -1);
    const timeStr = date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: true });

    detailEl.innerHTML = `
      <div class="order-header">
        <div class="order-icon">📋</div>
        <div class="order-info">
          <div class="order-number">주문 <span class="order-number-highlight">#${data.id}</span></div>
          <div class="order-time">${dateStr} ${timeStr}</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-icon">👤</div>
        <div class="section-content">
          <div class="label">구매자</div>
          <div class="buyer-name">${data.buyer_name}</div>
        </div>
      </div>

      <div class="menu-section">
        <div class="menu-icon">☕</div>
        <div class="menu-content">
          <div class="menu-label">주문 메뉴</div>
          <div class="menu-name">${data.product}</div>
          <div class="quantity-row">
            <span class="quantity-label">수량</span>
            <span class="quantity-value">${data.quantity}개</span>
          </div>
        </div>
      </div>

      <div class="payment-section">
        <div class="payment-icon">💰</div>
        <div class="payment-content">
          <div class="payment-label">결제 정보</div>
          <div class="price-line">${data.price_per_unit.toLocaleString('ko-KR')}원 × ${data.quantity}</div>
          <div class="total-line">${data.total_price.toLocaleString('ko-KR')}원</div>
        </div>
      </div>

      <div class="status-section">
        <div class="status-badge">
          <div class="status-left">
            <span class="status-icon"></span>
            <span>주문 완료</span>
          </div>
          <div class="status-right">›</div>
        </div>
      </div>
    `;
  } catch (err) {
    detailEl.innerHTML = `<div class="error">오류: ${err.message}</div>`;
  }
}

load();
</script>
</body>
</html>
