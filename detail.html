<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 상세</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Apple SD Gothic Neo", Pretendard, sans-serif;
    background: #F7F6F2;
    margin: 0;
    padding: 24px 16px;
    min-height: 100vh;
  }

  .container { max-width: 400px; margin: 0 auto; }

  .back {
    display: inline-block;
    margin-bottom: 32px;
    color: #2E7D32;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
  .back:hover { text-decoration: underline; }

  .detail-container {
    background: #FFFFFF;
    padding: 32px 24px;
  }

  .order-header {
    margin-bottom: 8px;
  }

  .order-number {
    font-size: 28px;
    font-weight: 700;
    color: #202124;
    margin-bottom: 8px;
  }

  .order-time {
    font-size: 14px;
    color: #8A8A8A;
  }

  .divider {
    height: 1px;
    background: #E6E6E6;
    margin: 20px 0;
  }

  .section {
    margin-bottom: 0;
  }

  .section-content {
    padding: 20px 0;
  }

  .section:not(:last-child) .section-content {
    border-bottom: 1px solid #E6E6E6;
  }

  .label {
    font-size: 14px;
    color: #8A8A8A;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .value {
    font-size: 22px;
    font-weight: 600;
    color: #202124;
    line-height: 1.3;
  }

  .buyer-name {
    font-size: 22px;
    font-weight: 600;
    color: #202124;
  }

  .menu-section {
    padding: 24px 0;
    border-bottom: 1px solid #E6E6E6;
  }

  .menu-name {
    font-size: 28px;
    font-weight: 700;
    color: #202124;
    margin-bottom: 16px;
  }

  .quantity-row {
    display: flex;
    align-items: flex-end;
    gap: 16px;
  }

  .quantity-label {
    font-size: 14px;
    color: #8A8A8A;
  }

  .quantity-value {
    font-size: 20px;
    font-weight: 600;
    color: #202124;
  }

  .payment-section {
    padding: 20px 0;
    border-bottom: 1px solid #E6E6E6;
  }

  .payment-label {
    font-size: 14px;
    color: #8A8A8A;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .price-line {
    font-size: 18px;
    color: #8A8A8A;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .total-line {
    font-size: 20px;
    font-weight: 600;
    color: #202124;
  }

  .status-section {
    padding: 20px 0;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    color: #2E7D32;
  }

  .status-icon {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #2E7D32;
  }

  .error {
    color: #D32F2F;
    padding: 16px;
    background: #FFEBEE;
    border-radius: 4px;
    font-size: 14px;
    text-align: center;
  }

  .loading {
    color: #8A8A8A;
    text-align: center;
    font-size: 14px;
    padding: 40px 20px;
  }
</style>
</head>
<body>
  <div class="container">
    <a class="back" href="list.html">← 판매 현황으로</a>
    <div class="detail-container" id="detail">
      <div class="loading">주문 정보를 불러오는 중...</div>
    </div>
  </div>

<script>
async function load() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  const detailEl = document.getElementById('detail');

  if (!id) {
    detailEl.innerHTML = '<div class="error">주문 번호가 없습니다</div>';
    return;
  }

  try {
    const res = await fetch(`/api/list?id=${id}`);
    if (!res.ok) {
      detailEl.innerHTML = '<div class="error">주문을 찾을 수 없습니다</div>';
      return;
    }
    const data = await res.json();

    const date = new Date(data.purchased_at);
    const dateStr = date.toLocaleDateString('ko-KR').replace(/\./g, '.').slice(0, -1);
    const timeStr = date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: true });

    detailEl.innerHTML = `
      <div class="order-header">
        <div class="order-number">주문 #${data.id}</div>
        <div class="order-time">${dateStr} ${timeStr}</div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <div class="section-content">
          <div class="label">구매자</div>
          <div class="buyer-name">${data.buyer_name}</div>
        </div>
      </div>

      <div class="menu-section">
        <div class="label">주문 메뉴</div>
        <div class="menu-name">${data.product}</div>
        <div class="quantity-row">
          <span class="quantity-label">수량</span>
          <span class="quantity-value">${data.quantity}개</span>
        </div>
      </div>

      <div class="payment-section">
        <div class="payment-label">결제 정보</div>
        <div class="price-line">${data.price_per_unit.toLocaleString('ko-KR')}원 × ${data.quantity}</div>
        <div class="total-line">합계 ${data.total_price.toLocaleString('ko-KR')}원</div>
      </div>

      <div class="status-section">
        <div class="status-badge">
          <span class="status-icon"></span>
          <span>제조 완료</span>
        </div>
      </div>
    `;
  } catch (err) {
    detailEl.innerHTML = `<div class="error">오류: ${err.message}</div>`;
  }
}

load();
</script>
</body>
</html>
