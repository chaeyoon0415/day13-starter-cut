<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 - 판매 현황</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Apple SD Gothic Neo", Pretendard, sans-serif;
    background: #F7F7F7;
    margin: 0;
    padding: 32px 20px;
    color: #1A1A1A;
  }

  .container { max-width: 1200px; margin: 0 auto; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }

  h1 {
    font-size: 34px;
    font-weight: 700;
    margin: 0;
  }

  .header-action {
    display: flex;
    gap: 12px;
  }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: #C62828;
    color: white;
  }

  .btn-primary:hover {
    background: #B71C1C;
  }

  .btn-outline {
    background: white;
    color: #1A1A1A;
    border: 1px solid #E8E8E8;
  }

  .btn-outline:hover {
    background: #FAFAFA;
  }

  .btn-outline.active {
    background: #C62828;
    color: white;
    border-color: #C62828;
  }

  /* KPI Cards */
  .kpi-section {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 32px;
  }

  .kpi-card {
    background: #FFFFFF;
    padding: 24px;
    border-radius: 12px;
    border: 1px solid #E8E8E8;
  }

  .kpi-label {
    font-size: 14px;
    color: #666666;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .kpi-value {
    font-size: 34px;
    font-weight: 700;
    color: #C62828;
  }

  /* Status Index */
  .status-index {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    padding: 16px 0;
    font-size: 14px;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .status-dot.complete {
    background: #2E7D32;
  }

  .status-dot.cancel {
    background: #C62828;
  }

  /* Search & Filter */
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    background: white;
    padding: 16px 20px;
    border-radius: 12px;
    border: 1px solid #E8E8E8;
  }

  .control-left {
    display: flex;
    gap: 12px;
    flex: 1;
  }

  .search-box {
    flex: 1;
    position: relative;
    min-width: 200px;
  }

  .search-box input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border: 1px solid #E8E8E8;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }

  .search-box input::placeholder {
    color: #999999;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #999999;
    font-size: 16px;
  }

  .date-filter {
    position: relative;
  }

  .date-filter input {
    padding: 10px 14px;
    border: 1px solid #E8E8E8;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    min-width: 140px;
  }

  .date-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #999999;
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    display: none;
  }

  .date-filter input:not(:placeholder-shown) ~ .date-clear {
    display: block;
  }

  .sort-buttons {
    display: flex;
    gap: 8px;
  }

  /* Table */
  .table-container {
    background: white;
    border-radius: 12px;
    border: 1px solid #E8E8E8;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    background: #F5F5F5;
    border-bottom: 1px solid #E8E8E8;
  }

  th {
    padding: 16px 20px;
    text-align: left;
    font-size: 15px;
    font-weight: 600;
    color: #1A1A1A;
  }

  tbody tr {
    border-bottom: 1px solid #E8E8E8;
    cursor: pointer;
    transition: background 0.15s;
    height: 68px;
  }

  tbody tr:hover {
    background: #FAFAFA;
  }

  tbody tr.selected {
    background: #FFF3F3;
  }

  td {
    padding: 16px 20px;
    font-size: 16px;
    font-weight: 500;
    color: #1A1A1A;
  }

  td.num {
    text-align: right;
    color: #666666;
    font-weight: 400;
  }

  td.time {
    color: #666666;
    font-weight: 400;
    font-size: 14px;
  }

  /* Badge */
  .badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-success {
    background: #E8F5EC;
    color: #2E7D32;
  }

  .badge-cancel {
    background: #FFEBEE;
    color: #C62828;
  }

  .badge-pending {
    background: #FFF3CD;
    color: #856404;
  }

  .badge-process {
    background: #E3F2FD;
    color: #1565C0;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #999999;
    font-size: 14px;
  }

  @media (max-width: 768px) {
    .kpi-section {
      grid-template-columns: 1fr;
    }

    .controls {
      flex-direction: column;
      align-items: stretch;
    }

    .search-box input {
      width: 100%;
    }

    table {
      font-size: 14px;
    }

    td {
      padding: 12px 16px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>판매 현황</h1>
      <div class="header-action">
        <a href="index.html" class="btn btn-primary">+ 주문 등록</a>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-section">
      <div class="kpi-card">
        <div class="kpi-label">총 주문</div>
        <div class="kpi-value" id="kpi-count">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">총 매출</div>
        <div class="kpi-value" id="kpi-revenue">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">평균 주문액</div>
        <div class="kpi-value" id="kpi-avg">-</div>
      </div>
    </div>

    <!-- Status Index -->
    <div class="status-index">
      <div class="status-item">
        <span class="status-dot complete"></span>
        <span>주문 완료</span>
      </div>
      <div class="status-item">
        <span class="status-dot cancel"></span>
        <span>주문 취소</span>
      </div>
    </div>

    <!-- Search & Sort -->
    <div class="controls">
      <div class="control-left">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input id="search" type="text" placeholder="구매자 또는 메뉴 검색">
        </div>
        <div class="date-filter">
          <input id="dateFilter" type="date" placeholder="날짜 선택">
          <button class="date-clear">✕</button>
        </div>
      </div>
      <div class="sort-buttons">
        <button class="btn btn-outline active" data-sort="desc">최신순</button>
        <button class="btn btn-outline" data-sort="asc">오래된순</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>구매자</th>
            <th>메뉴</th>
            <th style="text-align: center;">수량</th>
            <th>주문시간</th>
            <th style="text-align: right;">금액</th>
            <th style="text-align: center;">상태</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" style="display: none;">주문 데이터가 없습니다</div>
    </div>
  </div>

<script>
let allRows = [];
let filteredRows = [];
let currentSort = 'desc';

function getStatus(id) {
  return id % 7 === 0 ? 'cancel' : 'complete';
}

async function load() {
  try {
    const res = await fetch('/api/list');
    if (!res.ok) throw new Error('Failed to load');

    allRows = await res.json().then(rows =>
      rows.map(r => ({
        ...r,
        status: getStatus(r.id)
      }))
    );
    filteredRows = [...allRows];

    render();
    updateKPI();
  } catch (err) {
    console.error('Load failed:', err);
  }
}

function updateKPI() {
  const count = filteredRows.length;
  const revenue = filteredRows.reduce((sum, r) => sum + r.total_price, 0);
  const avg = count > 0 ? Math.round(revenue / count) : 0;

  document.getElementById('kpi-count').textContent = count + '건';
  document.getElementById('kpi-revenue').textContent = revenue.toLocaleString('ko-KR') + '원';
  document.getElementById('kpi-avg').textContent = avg.toLocaleString('ko-KR') + '원';
}

function filter() {
  const query = document.getElementById('search').value.toLowerCase();
  const dateStr = document.getElementById('dateFilter').value;

  filteredRows = allRows.filter(r => {
    const matchQuery = !query ||
      r.buyer_name.toLowerCase().includes(query) ||
      r.product.toLowerCase().includes(query);

    const matchDate = !dateStr ||
      new Date(r.purchased_at).toISOString().split('T')[0] === dateStr;

    return matchQuery && matchDate;
  });

  sort();
  render();
  updateKPI();
}

function sort() {
  const ascending = currentSort === 'asc';
  filteredRows.sort((a, b) =>
    ascending
      ? new Date(a.purchased_at) - new Date(b.purchased_at)
      : new Date(b.purchased_at) - new Date(a.purchased_at)
  );
}

function render() {
  const tbody = document.getElementById('rows');
  const empty = document.getElementById('empty');

  if (filteredRows.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  tbody.innerHTML = filteredRows.map(r => {
    const time = new Date(r.purchased_at).toLocaleString('ko-KR', {
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hour12: true
    });
    const badgeClass = r.status === 'complete' ? 'badge-success' : 'badge-cancel';
    const statusText = r.status === 'complete' ? '●' : '●';
    return `<tr onclick="location.href='detail.html?id=${r.id}'">
      <td>#${r.id}</td>
      <td>${r.buyer_name}</td>
      <td>${r.product}</td>
      <td style="text-align: center;">${r.quantity}개</td>
      <td class="time">${time}</td>
      <td class="num">${r.total_price.toLocaleString('ko-KR')}원</td>
      <td style="text-align: center;"><span class="badge ${badgeClass}">${statusText}</span></td>
    </tr>`;
  }).join('');
}

// Event listeners
document.getElementById('search').addEventListener('input', filter);
document.getElementById('dateFilter').addEventListener('change', filter);

document.querySelector('.date-clear').addEventListener('click', () => {
  document.getElementById('dateFilter').value = '';
  filter();
});

document.querySelectorAll('[data-sort]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentSort = e.target.dataset.sort;
    sort();
    render();
  });
});

load();
</script>
</body>
</html>
