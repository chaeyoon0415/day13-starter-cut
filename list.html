<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 - 판매 현황</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Apple SD Gothic Neo", Pretendard, sans-serif;
    background: #FCFBF8;
    margin: 0;
    padding: 32px 20px;
    color: #1A1A1A;
    position: relative;
  }

  /* Radial Gradient Blur Background */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at 15% 20%, rgba(255, 125, 125, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(255, 216, 194, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 90% 10%, rgba(244, 229, 216, 0.04) 0%, transparent 45%);
    pointer-events: none;
    z-index: -1;
  }

  .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 48px;
  }

  .header-title {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    flex: 1;
  }

  .header-bar {
    width: 6px;
    height: 48px;
    background: #C62828;
    border-radius: 6px;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-size: 34px;
    font-weight: 700;
    margin: 0 0 8px 0;
  }

  .header-subtitle {
    font-size: 16px;
    font-weight: 500;
    color: #8C8C8C;
    margin: 0;
  }

  .header-action {
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    height: 48px;
    display: flex;
    align-items: center;
  }

  .btn-primary {
    background: #C62828;
    color: white;
    box-shadow: 0 4px 12px rgba(198, 40, 40, 0.15);
  }

  .btn-primary:hover {
    background: #B71C1C;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(198, 40, 40, 0.25);
  }

  .btn-outline {
    background: white;
    color: #1A1A1A;
    border: 1px solid #E8E8E8;
    height: 56px;
    padding: 14px 24px;
    border-radius: 12px;
    transition: all 0.2s ease;
  }

  .btn-outline:hover {
    background: #FAFAFA;
    border-color: #D0D0D0;
  }

  .btn-outline.active {
    background: #C62828;
    color: white;
    border-color: #C62828;
    box-shadow: 0 4px 12px rgba(198, 40, 40, 0.15);
  }

  /* KPI Cards */
  .kpi-section {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-bottom: 48px;
  }

  .kpi-card {
    background: #FFFFFF;
    padding: 32px;
    border-radius: 20px;
    border: 1px solid #F1F1F1;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    display: flex;
    gap: 20px;
    transition: all 0.2s ease;
  }

  .kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
  }

  .kpi-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #FFF2F2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }

  .kpi-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .kpi-label {
    font-size: 14px;
    color: #8C8C8C;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .kpi-value {
    font-size: 48px;
    font-weight: 700;
    color: #C62828;
    line-height: 1;
    margin-bottom: 12px;
  }

  .kpi-change {
    font-size: 13px;
    color: #666666;
  }

  .kpi-change strong {
    color: #C62828;
    font-weight: 600;
  }

  /* Status Index */
  .status-index {
    display: flex;
    gap: 32px;
    margin-bottom: 32px;
    padding: 0;
    font-size: 14px;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .status-dot.complete {
    background: #2E7D32;
  }

  .status-dot.cancel {
    background: #C62828;
  }

  /* Search & Filter */
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
    background: white;
    padding: 20px;
    border-radius: 20px;
    border: 1px solid #F1F1F1;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
  }

  .control-left {
    display: flex;
    gap: 12px;
    flex: 1;
  }

  .search-box {
    flex: 1;
    position: relative;
    min-width: 200px;
  }

  .search-box input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    border: 1px solid #E8E8E8;
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    height: 56px;
    transition: all 0.2s ease;
  }

  .search-box input:focus {
    outline: none;
    border-color: #C62828;
    box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.1);
  }

  .search-box input::placeholder {
    color: #999999;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #999999;
    font-size: 18px;
  }

  .date-filter {
    position: relative;
  }

  .date-filter input {
    padding: 14px 16px;
    border: 1px solid #E8E8E8;
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    min-width: 160px;
    height: 56px;
    transition: all 0.2s ease;
  }

  .date-filter input:focus {
    outline: none;
    border-color: #C62828;
    box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.1);
  }

  .date-clear {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #999999;
    cursor: pointer;
    font-size: 18px;
    padding: 0;
    display: none;
    transition: color 0.2s ease;
  }

  .date-clear:hover {
    color: #C62828;
  }

  .date-filter input:not(:placeholder-shown) ~ .date-clear {
    display: block;
  }

  .sort-buttons {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  /* Table */
  .table-container {
    background: white;
    border-radius: 20px;
    border: 1px solid #F1F1F1;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    background: #FFFFFF;
    border-bottom: 1px solid #E8E8E8;
  }

  th {
    padding: 20px;
    text-align: left;
    font-size: 15px;
    font-weight: 600;
    color: #1A1A1A;
  }

  tbody tr {
    border-bottom: 1px solid #E8E8E8;
    cursor: pointer;
    transition: all 0.2s ease;
    height: 72px;
    background: #FFFFFF;
  }

  tbody tr:first-child {
    background: #FFF7F7;
  }

  tbody tr:hover {
    background: #FAFAFA;
    transform: translateY(-1px);
  }

  tbody tr.selected {
    background: #FFF3F3;
  }

  td {
    padding: 20px;
    font-size: 15px;
    font-weight: 500;
    color: #1A1A1A;
  }

  td.num {
    text-align: right;
    color: #666666;
    font-weight: 400;
  }

  td.time {
    color: #666666;
    font-weight: 400;
    font-size: 14px;
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    height: 32px;
  }

  .badge-success {
    background: #EAF9EC;
    color: #2E7D32;
  }

  .badge-success::before {
    content: '●';
    font-size: 8px;
    color: #2E7D32;
  }

  .badge-cancel {
    background: #FFEBEE;
    color: #C62828;
  }

  .badge-cancel::before {
    content: '●';
    font-size: 8px;
    color: #C62828;
  }

  .badge-pending {
    background: #FFF9E6;
    color: #F0A500;
  }

  .badge-pending::before {
    content: '●';
    font-size: 8px;
    color: #F0A500;
  }

  .badge-process {
    background: #E3F2FD;
    color: #1565C0;
  }

  .badge-process::before {
    content: '●';
    font-size: 8px;
    color: #1565C0;
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: #999999;
    font-size: 14px;
    background: #FFFFFF;
    border-radius: 20px;
  }

  .chevron {
    color: #999999;
    font-weight: 300;
    transition: color 0.2s ease;
  }

  tbody tr:hover .chevron {
    color: #C62828;
  }

  @media (max-width: 768px) {
    .kpi-section {
      grid-template-columns: 1fr;
    }

    .header {
      flex-direction: column;
      gap: 16px;
    }

    .controls {
      flex-direction: column;
      align-items: stretch;
    }

    .sort-buttons {
      width: 100%;
      justify-content: flex-start;
    }

    .search-box input {
      width: 100%;
    }

    table {
      font-size: 14px;
    }

    th, td {
      padding: 14px 12px;
    }

    .kpi-card {
      flex-direction: column;
    }

    .kpi-value {
      font-size: 36px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title">
        <div class="header-bar"></div>
        <div class="header-text">
          <h1>판매 현황</h1>
          <p class="header-subtitle">오늘도 수고하셨습니다!</p>
        </div>
      </div>
      <div class="header-action">
        <a href="index.html" class="btn btn-primary">+ 주문 등록</a>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-section">
      <div class="kpi-card">
        <div class="kpi-icon">📋</div>
        <div class="kpi-info">
          <div class="kpi-label">총 주문</div>
          <div class="kpi-value" id="kpi-count">-</div>
          <div class="kpi-change">어제 대비 <strong>+12건</strong></div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">💰</div>
        <div class="kpi-info">
          <div class="kpi-label">총 매출</div>
          <div class="kpi-value" id="kpi-revenue">-</div>
          <div class="kpi-change">어제 대비 <strong>+46,000원</strong></div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">📊</div>
        <div class="kpi-info">
          <div class="kpi-label">평균 주문액</div>
          <div class="kpi-value" id="kpi-avg">-</div>
          <div class="kpi-change">어제 대비 <strong>+523원</strong></div>
        </div>
      </div>
    </div>

    <!-- Status Index -->
    <div class="status-index">
      <div class="status-item">
        <span class="status-dot complete"></span>
        <span>주문 완료</span>
      </div>
      <div class="status-item">
        <span class="status-dot cancel"></span>
        <span>주문 취소</span>
      </div>
    </div>

    <!-- Search & Sort -->
    <div class="controls">
      <div class="control-left">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input id="search" type="text" placeholder="구매자 또는 메뉴 검색">
        </div>
        <div class="date-filter">
          <input id="dateFilter" type="date" placeholder="날짜 선택">
          <button class="date-clear">✕</button>
        </div>
      </div>
      <div class="sort-buttons">
        <button class="btn btn-outline active" data-sort="desc">최신순</button>
        <button class="btn btn-outline" data-sort="asc">오래된순</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>구매자</th>
            <th>메뉴</th>
            <th style="text-align: center;">수량</th>
            <th>주문시간</th>
            <th style="text-align: right;">금액</th>
            <th style="text-align: center;">상태</th>
            <th style="text-align: center;"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" style="display: none;">주문 데이터가 없습니다</div>
    </div>
  </div>

<script>
let allRows = [];
let filteredRows = [];
let currentSort = 'desc';

function getStatus(id) {
  const mod = id % 5;
  if (mod === 0) return 'cancel';
  if (mod === 1) return 'pending';
  if (mod === 2) return 'process';
  return 'complete';
}

async function load() {
  try {
    const res = await fetch('/api/list');
    if (!res.ok) throw new Error('Failed to load');

    allRows = await res.json().then(rows =>
      rows.map(r => ({
        ...r,
        status: getStatus(r.id)
      }))
    );
    filteredRows = [...allRows];

    render();
    updateKPI();
  } catch (err) {
    console.error('Load failed:', err);
  }
}

function updateKPI() {
  const count = filteredRows.length;
  const revenue = filteredRows.reduce((sum, r) => sum + r.total_price, 0);
  const avg = count > 0 ? Math.round(revenue / count) : 0;

  document.getElementById('kpi-count').textContent = count + '건';
  document.getElementById('kpi-revenue').textContent = revenue.toLocaleString('ko-KR') + '원';
  document.getElementById('kpi-avg').textContent = avg.toLocaleString('ko-KR') + '원';
}

function filter() {
  const query = document.getElementById('search').value.toLowerCase();
  const dateStr = document.getElementById('dateFilter').value;

  filteredRows = allRows.filter(r => {
    const matchQuery = !query ||
      r.buyer_name.toLowerCase().includes(query) ||
      r.product.toLowerCase().includes(query);

    const matchDate = !dateStr ||
      new Date(r.purchased_at).toISOString().split('T')[0] === dateStr;

    return matchQuery && matchDate;
  });

  sort();
  render();
  updateKPI();
}

function sort() {
  const ascending = currentSort === 'asc';
  filteredRows.sort((a, b) =>
    ascending
      ? new Date(a.purchased_at) - new Date(b.purchased_at)
      : new Date(b.purchased_at) - new Date(a.purchased_at)
  );
}

function render() {
  const tbody = document.getElementById('rows');
  const empty = document.getElementById('empty');

  if (filteredRows.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  tbody.innerHTML = filteredRows.map(r => {
    const time = new Date(r.purchased_at).toLocaleString('ko-KR', {
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hour12: true
    });

    let badgeClass = 'badge-success';
    let statusText = '완료';
    if (r.status === 'cancel') {
      badgeClass = 'badge-cancel';
      statusText = '취소';
    } else if (r.status === 'pending') {
      badgeClass = 'badge-pending';
      statusText = '대기';
    } else if (r.status === 'process') {
      badgeClass = 'badge-process';
      statusText = '제조중';
    }

    return `<tr onclick="location.href='detail.html?id=${r.id}'">
      <td>#${r.id}</td>
      <td>${r.buyer_name}</td>
      <td>${r.product}</td>
      <td style="text-align: center;">${r.quantity}개</td>
      <td class="time">${time}</td>
      <td class="num">${r.total_price.toLocaleString('ko-KR')}원</td>
      <td style="text-align: center;"><span class="badge ${badgeClass}">${statusText}</span></td>
      <td style="text-align: center; color: #999999; cursor: pointer;"><span class="chevron">›</span></td>
    </tr>`;
  }).join('');
}

// Event listeners
document.getElementById('search').addEventListener('input', filter);
document.getElementById('dateFilter').addEventListener('change', filter);

document.querySelector('.date-clear').addEventListener('click', () => {
  document.getElementById('dateFilter').value = '';
  filter();
});

document.querySelectorAll('[data-sort]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentSort = e.target.dataset.sort;
    sort();
    render();
  });
});

load();
</script>
</body>
</html>
